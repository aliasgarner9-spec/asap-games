<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A$AP Games</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
header{padding:28px 20px;text-align:center;background:linear-gradient(135deg,#171722,#09090c);border-bottom:1px solid #292936}
h1{font-size:42px;margin:0 0 8px}header p{margin:0;color:#aaa}
main{max-width:1000px;margin:auto;padding:22px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input,button{border:0;border-radius:12px;padding:13px 15px;font-size:15px}
input{flex:1;min-width:220px;background:#191922;color:#fff}
button{background:#242432;color:#fff;cursor:pointer}button:hover{background:#353547}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#15151d;border:1px solid #292936;border-radius:18px;padding:20px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.icon{font-size:44px}.card h2{margin:10px 0 5px}.card p{color:#aaa;margin:0 0 15px}
.play{width:100%;background:#fff;color:#000;font-weight:bold}.play:hover{background:#ddd}
#message{color:#aaa;text-align:center;margin-top:20px;display:none}
footer{text-align:center;color:#666;padding:35px 15px}
</style>
</head>
<body>
<header>
  <h1>🎮 A$AP Games</h1>
  <p>Your mini game hub</p>
</header>
<main>
  <div class="controls">
    <input id="search" placeholder="🔎 Search games..." oninput="render()">
    <button onclick="showAll()">All</button>
    <button onclick="showArcade()">Arcade</button>
    <button onclick="showPuzzle()">Puzzle</button>
  </div>
  <section class="games" id="games"></section>
  <div id="message">No games found.</div>
</main>
<footer>Made with HTML • Add your own games later</footer>

<script>
const games=[
 {name:"Snake",cat:"Arcade",icon:"🐍",url:"https://playsnake.org/"},
 {name:"2048",cat:"Puzzle",icon:"🔢",url:"https://play2048.co/"},
 {name:"Tetris",cat:"Puzzle",icon:"🧱",url:"https://tetris.com/play-tetris"},
 {name:"Cookie Clicker",cat:"Arcade",icon:"🍪",url:"https://orteil.dashnet.org/cookieclicker/"}
];
let filter="All";
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=games.filter(g=>(filter==="All"||g.cat===filter)&&g.name.toLowerCase().includes(q));
 document.getElementById("games").innerHTML=list.map(g=>`
 <article class="card">
   <div><div class="icon">${g.icon}</div><h2>${g.name}</h2><p>${g.cat}</p></div>
   <button class="play" onclick="window.open('${g.url}','_blank')">PLAY ▶</button>
 </article>`).join("");
 document.getElementById("message").style.display=list.length?"none":"block";
}
function showAll(){filter="All";render()} function showArcade(){filter="Arcade";render()} function showPuzzle(){filter="Puzzle";render()}
render();
</script>
</body>
</html>
